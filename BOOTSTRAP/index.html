<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Site com Bootstrap</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzap3H66lZH81PoYlFhbGU+6BZp6G7nC3iq6k9K/ux7r+0Uod8GCExl
4" crossorigin="anonymous">
    </head>
    <body>
        <div class="container">
            <div class="row justify-content-center vh-100">
                <div class="col-9 col-sm-6 bg-primary">
                    <div class='container-fluid'>
                        <div class='row'>
                            <div class="col">
                                <h1 class="text-white text-center">Olá, mundo!</h1>
                            </div>
                        <div class="row">
                            <div class="col">
                                <form>
                                    <div class="mb-3">
                                        <label for="exampleInputEmail1" class="form-label text-white">Endereço de email</label>
                                        <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                                        <div id="emailHelp" class="form-text text-white">Nunca compartilharemos seu email com mais ninguém.</div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="exampleInputPassword1" class="form-label text-white">Senha</label>
                                        <input type="password" class="form-control" id="exampleInputPassword1">
                                    </div>
                                    <div class="mb-3 form-check">
                                        <input type="checkbox" class="form-check-input" id="exampleCheck1">
                                        <label class="form-check-label text-white" for="exampleCheck1">Me lembre</label>
                            </div>                                
                            </div>
                        </div>
                        </div>
                    </div>
                </div>
            </div>
        </div> 
    </body>
</html>
