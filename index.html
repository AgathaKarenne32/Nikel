<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="IE-edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site com Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
</head>
<body class="backgroud-city">
    <div class="container">
        <div class="row justify-content-center vh-100">
            <div class ="col-10 col-sm-6">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col text-center m-5">
                            <img src="./images/download.png" class="img-fluid" alt="logo growdev" width="200">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col">
                            <form action="home.html">
                                <div class="mb-3">
                                    <label for="email" class="form-label text-white">Email:</label>
                                    <input type="email" class="form-control" id="email" placeholder="Digite seu email">
                                    <div id="emailHelp" class="form-text text-white">Nunca compartilharemos seu email com mais ninguém.</div>
                                </div>
                                <div class="mb-3">
                                    <label for="exampleInputPassword1" class="form-label text-white">Senha:</label>
                                    <input type="password" class="form-control" id="password" placeholder="Digite sua senha">
                                </div>
                                <div class="mpb-3 form-check">
                                    <input type="checkbox" class="form-check-input" id="rememberMe">
                                    <label class="form-check-label" for="exampleCheck1 text-white">Lembrar-me</label>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Entrar</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       
</html>
